<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NeoBot - AI Talking Robot Guide</title>
  <meta name="description" content="AI Talking Robot for School Science Exhibition powered by Google Gemini Multimodal Live API.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="2"></rect>
          <circle cx="12" cy="5" r="2"></circle>
          <path d="M12 7v4"></path>
          <line x1="8" y1="16" x2="8" y2="16"></line>
          <line x1="16" y1="16" x2="16" y2="16"></line>
        </svg>
        <span class="brand-title">NeoBot AI</span>
      </div>

      <button id="settings-btn" class="header-btn" title="Backend Settings" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Status Pill -->
    <div class="status-pill-container">
      <div id="status-pill" class="status-pill" data-state="idle">
        <span class="status-dot"></span>
        <span id="status-text">Robot Asleep - Tap Run</span>
      </div>
    </div>

    <!-- Robot Face Stage -->
    <main class="robot-face-stage">
      <div id="robot-face" class="robot-face" data-state="idle">
        <!-- Expressive Digital Eyes -->
        <div class="eyes-container">
          <div class="eye left-eye"></div>
          <div class="eye right-eye"></div>
        </div>

        <!-- Animated Audio Waveform Mouth -->
        <div class="mouth-waveform">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>

        <!-- Camera Thumbnail (for cardboard robot aperture alignment) -->
        <div id="camera-preview" class="camera-preview-container">
          <video id="camera-video" playsinline muted autoplay></video>
          <button id="cam-flip-btn" class="cam-flip-btn" title="Flip Camera" aria-label="Flip Camera">⇄</button>
        </div>
      </div>
    </main>

    <!-- Controls -->
    <footer class="controls-container">
      <button id="run-btn" class="control-btn run-btn" aria-label="Run Robot">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span>Run</span>
      </button>

      <button id="stop-btn" class="control-btn stop-btn" disabled aria-label="Stop Robot">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="6" width="12" height="12" rx="2"></rect>
        </svg>
        <span>Stop</span>
      </button>
    </footer>
  </div>

  <!-- Settings Modal (Backend URL Config) -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Robot Settings</h2>
        <button id="modal-close-btn" class="modal-close-btn">&times;</button>
      </div>

      <div class="form-group">
        <label for="backend-url-input" class="form-label">Backend Service URL (Render):</label>
        <input type="url" id="backend-url-input" class="form-input" placeholder="https://your-service.onrender.com" spellcheck="false">
        <p class="form-hint">Points to your deployed Express backend on Render.</p>
      </div>

      <div class="modal-actions">
        <button id="test-backend-btn" class="btn-secondary">Test Connection</button>
        <button id="save-settings-btn" class="btn-primary">Save Settings</button>
      </div>
    </div>
  </div>

  <!-- Main JavaScript Controller (ES Module) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
